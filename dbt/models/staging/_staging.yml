version: 2

sources:
  - name: raw
    database: "{{ env_var('BQ_PROJECT') }}"
    schema: "{{ 'dev_raw' if target.name == 'dev' else 'raw' }}"
    loaded_at_field: added_at
    freshness:
      warn_after: {count: 25, period: hour}
      error_after: {count: 49, period: hour}
    tables:
      - name: saved_tracks
        description: Spotify お気に入り楽曲の生データ。ETL により毎週全件 WRITE_TRUNCATE でロード。
      - name: artists
        description: Spotify アーティストの生データ。ETL により毎週全件 WRITE_TRUNCATE でロード。
        loaded_at_field: null

models:
  - name: stg_saved_tracks
    description: raw.saved_tracks の track JSON を展開したステージングモデル。1行=1曲。
    columns:
      - name: added_at
        description: お気に入りに追加した日時
        data_type: timestamp
        tests:
          - not_null
      - name: added_datetime
        description: お気に入りに追加した日時
        data_type: datetime
        tests:
          - not_null
      - name: added_date
        description: お気に入りに追加した日付
        data_type: date
        tests:
          - not_null
      - name: track_id
        description: Spotify トラック ID
        data_type: string
        tests:
          - not_null
          - unique
      - name: track_name
        description: 曲名
        data_type: string
        tests:
          - not_null
      - name: duration_ms
        description: 曲の長さ（ミリ秒）
        data_type: int64
        tests:
          - not_null
      - name: explicit
        description: 過激なコンテンツフラグ
        data_type: bool
        tests:
          - not_null
      - name: spotify_url
        description: Spotify の曲 URL
        data_type: string
        tests:
          - not_null
      - name: isrc
        description: 国際標準レコーディングコード（ISRC）。Spotify 側で未設定の場合は NULL。
        data_type: string
      - name: album_id
        description: Spotify アルバム ID
        data_type: string
        tests:
          - not_null
      - name: album_name
        description: アルバム名
        data_type: string
        tests:
          - not_null
      - name: album_type
        description: アルバム種別（album / single / compilation）
        data_type: string
        tests:
          - not_null
      - name: album_release_date
        description: アルバムのリリース日。Spotify が年のみ（例：1995）を返す場合があるため文字列で保持。
        data_type: string
        tests:
          - not_null
      - name: artists
        description: アーティスト情報の JSON 配列。int_track_artists で UNNEST して使用。
        data_type: json
        tests:
          - not_null

  - name: stg_artists
    description: raw.artists の artist JSON を展開したステージングモデル。1行=1アーティスト。
    columns:
      - name: artist_id
        description: Spotify アーティスト ID（主キー）
        data_type: string
        tests:
          - not_null
          - unique
      - name: artist_name
        description: アーティスト名
        data_type: string
        tests:
          - not_null
      - name: genres
        description: ジャンルの JSON 配列（例：["j-pop", "hip-hop"]）。登録なしの場合は空配列。
        data_type: json
        tests:
          - not_null
      - name: popularity
        description: Spotify が算出するアーティスト人気度（0〜100）
        data_type: int64
        tests:
          - not_null
