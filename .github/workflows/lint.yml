name: Lint

on:
  pull_request:

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ruff
        run: pip install ruff

      - name: Check format
        run: ruff format --check etl/

      - name: Lint
        run: ruff check etl/

  lint-sql:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # dbt-bigquery、sqlfluff に加え、dbt連携プラグインを同じ環境にインストールします
      - name: Install sqlfluff and dbt dependencies
        run: pip install sqlfluff sqlfluff-templater-dbt dbt-bigquery

      # dbtマクロを正常に解決するため、CI環境でもdbtの依存パッケージをダウンロードさせます
      - name: Install dbt packages
        run: dbt deps --project-dir dbt

      # 引数から --dialect を削り、プロジェクトルートの .sqlfluff 設定ファイルを最優先で読ませます
      - name: Lint SQL
        env:
          # dbt のパース時に必要となる環境変数をダミー値（または任意の値）で注入します
          BQ_PROJECT: "dummy-project-id"
        run: sqlfluff lint dbt/models/
