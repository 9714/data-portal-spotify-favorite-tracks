name: Deploy

on:
  workflow_dispatch:

env:
  IMAGE: asia-northeast1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/spotify-etl/etl

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: github-actions-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker asia-northeast1-docker.pkg.dev --quiet

      - name: Build and push image
        run: |
          docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest .
          docker push $IMAGE:${{ github.sha }}
          docker push $IMAGE:latest

      - name: Deploy to Cloud Run Jobs
        run: |
          gcloud run jobs deploy spotify-etl \
            --image $IMAGE:${{ github.sha }} \
            --region ${{ secrets.GCP_REGION }} \
            --memory 512Mi \
            --task-timeout 300 \
            --set-secrets="SPOTIFY_CLIENT_ID=spotify-client-id:latest,SPOTIFY_CLIENT_SECRET=spotify-client-secret:latest,SPOTIFY_REFRESH_TOKEN=spotify-refresh-token:latest" \
            --set-env-vars="GCS_BUCKET=dp-spotify-raw,GCS_ENV=prd,BQ_PROJECT=${{ secrets.GCP_PROJECT_ID }},BQ_DATASET=raw" \
            --service-account=etl-job-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
            --project=${{ secrets.GCP_PROJECT_ID }}

      - name: Update Cloud Scheduler
        run: |
          if gcloud scheduler jobs describe spotify-etl-scheduler \
            --location=${{ secrets.GCP_REGION }} \
            --project=${{ secrets.GCP_PROJECT_ID }} 2>/dev/null; then
            gcloud scheduler jobs update http spotify-etl-scheduler \
              --schedule="0 21 * * 0" \
              --location=${{ secrets.GCP_REGION }} \
              --project=${{ secrets.GCP_PROJECT_ID }}
          else
            gcloud scheduler jobs create http spotify-etl-scheduler \
              --schedule="0 21 * * 0" \
              --uri="https://${{ secrets.GCP_REGION }}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${{ secrets.GCP_PROJECT_ID }}/jobs/spotify-etl:run" \
              --http-method=POST \
              --oauth-service-account-email=scheduler-sa@${{ secrets.GCP_PROJECT_ID }}.iam.gserviceaccount.com \
              --location=${{ secrets.GCP_REGION }} \
              --project=${{ secrets.GCP_PROJECT_ID }}
          fi
